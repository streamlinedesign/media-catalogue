<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Katalog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Schibsted+Grotesk:wght@800&display=swap">
<style>
  :root { --paper: #fffabd; --ink: #050505; --bg: var(--paper); --fg: var(--ink);
    --head: "Schibsted Grotesk", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, monospace; }
  @media (prefers-color-scheme: dark) { :root { --bg: var(--ink); --fg: var(--paper); --head: var(--mono); } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
    background: var(--bg); color: var(--fg); font: 15px/1.5 var(--mono); }
  form { width: 100%; max-width: 320px; display: grid; gap: 12px; }
  h1 { font: 800 44px/1 var(--head); letter-spacing: -0.03em; margin: 0 0 8px; }
  input, button { font: inherit; color: inherit; padding: 12px; border: 2px solid var(--fg); border-radius: 0; }
  input { background: transparent; }
  button { background: var(--fg); color: var(--bg); cursor: pointer; }
  @media (prefers-color-scheme: dark) { button { background: transparent; color: var(--fg); } button:hover { background: var(--fg); color: var(--bg); } }
  :focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
  p { margin: 0; min-height: 1.5em; }
</style>
</head>
<body>
<form method="post" action="/login">
  <h1>Katalog</h1>
  <label for="pw">Password</label>
  <input id="pw" name="password" type="password" autocomplete="current-password" required autofocus>
  <button type="submit">Sign in</button>
  <p role="status">__NOTE__</p>
</form>
</body>
</html>
